# Optimize wasm-pack release WASM artifact for size. LTO plus a single codegen
# unit keeps the merged build under the WASM artifact target.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
resolver = "2"
# API services own their manifest, dependency graph and build output.
exclude = ["crates/policy-server"]
members = [
    "crates/dambi-core",
    "crates/policy-engine",
    "crates/policy-engine-wasm",
    # crates/integration-tests is LOCAL-ONLY (gitignored, no production logic) —
    # intentionally NOT a member so a fresh clone builds without the dir present.
    "crates/adapters/abi-resolver",
    "crates/adapters/mappers",
    "crates/asset-model/state",
    "crates/asset-model/action",
    "crates/asset-model/transition",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Pinned versions every crate in this workspace agrees on.
[workspace.dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
alloy-dyn-abi = "0.8"
alloy-json-abi = "0.8"
anyhow = "1"
cedar-policy = "4"
base64 = "0.22.1"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
serde_json_canonicalizer = "=0.3.2"
hex = "0.4"
# Fixed-point decimal arithmetic used by policy-transition for derived field
# recompute (HF / LTV / PnL / liq_price).
rust_decimal = { version = "1.37", default-features = false, features = ["serde-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# Internal crates referenced by path.
dambi-core = { path = "crates/dambi-core", version = "0.1.0" }
policy-engine = { path = "crates/policy-engine", version = "0.1.0" }
abi-resolver = { path = "crates/adapters/abi-resolver", version = "0.1.0" }
mappers = { path = "crates/adapters/mappers", version = "0.1.0" }
policy-state = { path = "crates/asset-model/state", version = "0.1.0" }
policy-action = { path = "crates/asset-model/action", version = "0.1.0" }
policy-transition = { path = "crates/asset-model/transition", version = "0.1.0" }

# WASM bridge deps
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# Shared WalletStore trait (no async runtime dependency).
async-trait = "0.1"

# TS .d.ts generation — derives `Tsify` on every pub type that crosses the
# wasm boundary. `wasm-bindgen` is required at build time even when only the
# type bindings are emitted (Tsify uses wasm-bindgen's serde glue).
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
