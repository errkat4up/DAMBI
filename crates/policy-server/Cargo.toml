# Server-only workspace. Shared model crates remain owned by the SDK root.
[workspace]
resolver = "2"
members = ["db", "sync", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Preserve the release profile used before the workspace split.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
alloy-dyn-abi = "0.8"
async-trait = "0.1"
cedar-policy = "4"
hex = "0.4"
rust_decimal = { version = "1.37", default-features = false, features = ["serde-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"

policy-state = { path = "../asset-model/state", version = "0.1.0" }
policy-transition = { path = "../asset-model/transition", version = "0.1.0" }
policy-db = { path = "db", version = "0.1.0" }
policy-sync = { path = "sync", version = "0.1.0" }
