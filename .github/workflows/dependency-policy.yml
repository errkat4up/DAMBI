# 의존성 감사(cargo audit/deny)는 의존성이 바뀔 때 + 주 1회만 돈다 —
# 모든 PR에서 돌릴 이유가 없는 검사라 ci.yml에서 분리했다.
name: dependency-policy

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'crates/policy-server/Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/dependency-policy.yml'
  schedule:
    - cron: '0 1 * * 1' # 매주 월요일 (신규 RUSTSEC 공지 픽업)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - workspace: .
            cache-key: sdk
          - workspace: crates/policy-server
            cache-key: server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.cache-key }}"
          workspaces: "${{ matrix.workspace }} -> target"

      # Prebuilt binaries instead of `cargo install` from source (much faster,
      # same checks).
      - name: Install dependency tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Keep the repository root as cwd so both scans read .cargo/audit.toml.
      - name: Dependency audit
        run: cargo audit --file "${{ matrix.workspace }}/Cargo.lock" --deny warnings --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0048

      - name: Dependency policy
        run: cargo deny --manifest-path "${{ matrix.workspace }}/Cargo.toml" --config deny.toml check
