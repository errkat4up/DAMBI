# cargo-audit config. `proc-macro-error2` (RUSTSEC-2026-0173) is flagged
# "unmaintained" — it is a transitive dep of alloy-sol-macro (Ethereum types),
# not a vulnerability and not ours to fix. Ignore it here so `cargo audit`
# passes without changing the CI workflow. Remove when alloy drops it.
#
# `crypto-bigint` 0.5.5 (RUSTSEC-2026-0387, timing variability in constant-time
# ops) reaches the lockfile through p256 0.13 (dambi-core verifies policy-bundle
# signatures with public keys only; no secret-key operations) and through
# alloy-primitives' optional k256 (never built). Remove after upgrading p256 to
# 0.14 together with Alloy 1.x.
[advisories]
ignore = ["RUSTSEC-2026-0173", "RUSTSEC-2026-0387"]
